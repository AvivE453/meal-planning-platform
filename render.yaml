services:
  - type: web
    name: meal-planning-api
    runtime: node
    plan: free
    region: oregon
    # Verified locally end-to-end before committing: db:generate must run
    # before the turbo build (nest build depends on the generated Prisma
    # client existing at apps/api/generated/prisma), and the scoped
    # --filter=...@meal-planning/api target builds api plus its two workspace
    # dependencies (shared-types, algorithm) without also building web/mobile.
    # db:migrate:deploy runs here rather than as a preDeployCommand — that
    # Render feature needs a paid plan; folding it into the build is the free-tier
    # equivalent. `migrate deploy` (not `migrate dev`) only applies existing
    # migrations, never prompts, never generates new ones — safe to run on every build.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:generate && pnpm db:migrate:deploy && pnpm turbo run build --filter=...@meal-planning/api
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: 22
      # Secrets and per-environment values — set manually in the Render
      # dashboard, never committed. See README "Deployment" for where each
      # one comes from.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: EDAMAM_APP_ID
        sync: false
      - key: EDAMAM_APP_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
